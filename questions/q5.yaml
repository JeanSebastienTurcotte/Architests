id: q5
#Topic "Linear Algebra: True/False Variants"
type: tf

variants:
  - sub_id: v1
    generate_params: |
      load("helpers/tf_randomizer.sage")

      true_text  = "The inverse of an invertible matrix always exists."
      false_text = "The inverse of an invertible matrix never exists."

      statement, answer = tf_randomizer(true_text, false_text)
    question: "{{ statement }}"
    answer: "{{ answer }}"

  - sub_id: v2
    generate_params: |
      load("helpers/tf_randomizer.sage")

      true_text  = "The determinant of a diagonal matrix equals the product of its diagonal entries."
      false_text = "The determinant of a diagonal matrix equals the sum of its diagonal entries."

      statement, answer = tf_randomizer(true_text, false_text)
    question: "{{ statement }}"
    answer: "{{ answer }}"

  - sub_id: v3
    generate_params: |
      load("helpers/tf_randomizer.sage")

      true_text  = "If two matrices $A$ and $B$ commute, then $AB = BA$."
      false_text = "If two matrices $A$ and $B$ commute, then $AB = -BA$."

      statement, answer = tf_randomizer(true_text, false_text)
    question: "{{ statement }}"
    answer: "{{ answer }}"
