id: q3
question: "Compute the derivative of $f(x) = {{a}}x^2 + {{b}}x + {{c}}$."
answer: "$f'(x) = 2{{a}}x + {{b}}$"
solution: |
  Differentiate term by term:
  \[
    f'(x) = 2 \cdot {{a}}x + {{b}}.
  \]
generate_params: |
  from random import randint
  a = randint(1, 5)
  b = randint(0, 5)
  c = randint(0, 10)
generate_figure: |
  f(x) = {{a}}*x^2 + {{b}}*x + {{c}}
  p2 = plot(f(x), (x,-5,5))+plot(diff(f(x),x),(x,-5,5))
  p2.save("{{filename}}")
