id: q6 # Nom de la question. Même id que le nom du fichier
type: mcq  #Type de question open | tf | mcq
#Sujet: "Calcul intégrale"
variants: #Différentes variantes de la question
  - sub_id: v1 # Id de la variante
   # Description : Quadratique avec a,b, >0
   ################################################
   #Texte de la question. Utiliser '{{var}}' pour obtenir une variable aléatoire. 
    question: "L'intégrale \\( \\int_0^1 x^2\\,dx \\) est égale à:"
    #Réponse: Nécessaire pour les questions mcq.
    answer: "$\\tfrac{1}{3}$"
    #Liste de mauvaises réponses à la question.
    wrong_ans:
      - "$\\tfrac{1}{2}$"
      - "$\\tfrac{1}{4}$"
      - "$1$"

  - sub_id: v2
    question: "La dérivée de \\( F(x) = \\int_0^x \\sin t\\,dt \\) est:"
    answer: "$\\sin x$"
    wrong_ans:
      - "$\\cos x$"
      - "$-\\sin x$"
      - "$-\\cos x$"

  - sub_id: v3 #À tester
    question: "Donner tous les choix qui sont 1."
    answer: "[$1$,un,$e^0$]"
    wrong_ans:
      - "$0$"
      - "$\\tfrac{\\pi}{2}$"
      - "$-1$"
