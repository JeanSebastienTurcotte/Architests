id: q3   # Topic: Differentiation
type: open

variants:
  - sub_id: v1   # Power rule
    question: "NO RANDOM HERE Differentiate the function $f(x) = x^3 + 5x^2$."
    answer: "$f'(x) = 3x^2 + 10x$"

  - sub_id: v2   # Sum and constant rule
    question: "NO RANDOM HERE Differentiate $f(x) = 7x^4 - 3x + 5$."
    answer: "$f'(x) = 28x^3 - 3$"

  - sub_id: v3   # Product rule
    question: "NO RANDOM HERE Differentiate $f(x) = x^2 \\cdot \\sin(x)$."
    answer: "$f'(x) = 2x \\sin(x) + x^2 \\cos(x)$"
