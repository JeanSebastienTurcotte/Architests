id: q1   # Topic: Quadratic equations
type: open

variants:
  - sub_id: v1   # Simple positive coefficients
    question: "Find the TEST roots of the quadratic equation $x^2 + {{a}}x + {{b}} = 0$."
    answer: "The roots are $x = \\frac{-{{a}} \\pm \\sqrt{{a}}^2 - 4{{b}}}{2}$."
    generate_params: |
      from random import randint
      a = randint(1, 6)
      b = randint(1, 10)
    generate_figure: |
      p = plot(x^2 + {{a}}*x + {{b}}, (x,-10,10))
      p.save("{{filename}}")

  - sub_id: v2   # Mixed sign coefficients
    question: "Solve for $x$: $x^2 - {{a}}x + {{b}} = 0$."
    answer: "The roots are $x = \\frac{{a}} \\pm \\sqrt{{a}}^2 - 4{{b}}}{2}$."
    generate_params: |
      from random import randint
      a = randint(2, 8)
      b = randint(1, 5)
    generate_figure: |
      p = plot(-x^2 - {{a}}*x + {{b}}, (x,-10,10))
      p.save("{{filename}}")

  - sub_id: v3   # Perfect square trinomials
    question: "Factor the quadratic $x^2 + 2{{k}}x + {{k}}^2$."
    answer: "It factors as $(x + {{k}})^2$."
    generate_params: |
      from random import randint
      k = randint(1, 5)
    generate_figure: |
      p3 = plot(x^2 + 2*{{k}}*x + {{k}}^2, (x,-10,10))
      p3.save("{{filename}}")
