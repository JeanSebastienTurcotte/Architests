id: q6
type: mcq
#Topic: "Integral Calculus"
variants:
  - sub_id: v1
    question: "The integral \\( \\int_0^1 x^2\\,dx \\) equals:"
    answer: "$\\tfrac{1}{3}$"
    wrong_ans:
      - "$\\tfrac{1}{2}$"
      - "$\\tfrac{1}{4}$"
      - "$1$"

  - sub_id: v2
    question: "The derivative of the function \\( F(x) = \\int_0^x \\sin t\\,dt \\) is:"
    answer: "$\\sin x$"
    wrong_ans:
      - "$\\cos x$"
      - "$-\\sin x$"
      - "$-\\cos x$"

  - sub_id: v3
    question: "Which of the following represents an antiderivative of \\( e^{2x} \\)?"
    answer: "$\\tfrac{1}{2} e^{2x}$"
    wrong_ans:
      - "$2e^{2x}$"
      - "$e^{x^2}$"
      - "$x e^{2x}$"

  - sub_id: v4
    question: "If \\( \\int_0^a f(x)\\,dx = 5 \\), what is \\( \\int_a^0 f(x)\\,dx \\)?"
    answer: "$-5$"
    wrong_ans:
      - "$5$"
      - "$0$"
      - "$10$"

  - sub_id: v5
    question: "The area under \\( y = \\cos x \\) from \\( 0 \\) to \\( \\tfrac{\\pi}{2} \\) is:"
    answer: "$1$"
    wrong_ans:
      - "$0$"
      - "$\\tfrac{\\pi}{2}$"
      - "$-1$"
  - sub_id: v6 #Test multiple correct answers
    question: "Donner tous les choix qui sont 1."
    answer: "[$1$,un,$e^0$]"
    wrong_ans:
      - "$0$"
      - "$\\tfrac{\\pi}{2}$"
      - "$-1$"
