id: q4 # Nom de la question. Même id que le nom du fichier
type: tf  #Type de question open | tf | mcq
#Sujet: Propriétés des matrices

variants:  #Différentes variantes de la question
  - sub_id: v1 # Id de la variante
   # Description : Déterminant et matrice triangulaire
   ################################################
   #Texte de la question. Utiliser '{{var}}' pour obtenir une variable aléatoire. 
    question: "Le déterminant d'une matrice triangulaire est égal au produit des éléments de sa diagonale."
    #Réponse : Facultatif
    answer: true

  - sub_id: v2
    question: "Si un matrice $A$ est inversible, alors son déterminant est nul."
    answer: false

  - sub_id: v3
  #Avec une version aléatoire. Notez la fonction auxiliaire à charger.
    generate_params: |
      load("helpers/tf_randomizer.sage") 
      true_text = "La transposée d'une matrice symétrique est égale à elle-même."
      false_text = "La transposée d'une matrice symétrique est égale au négatif de la matrice."
      statement, answer = tf_randomizer(true_text, false_text)
    question: "{{ statement }}"
    answer: "{{ answer }}"
