id: q2   # Topic: Systems of linear equations

variants:
  - sub_id: v1   # Two equations, two variables
    question: "Solve the system: $\\begin{cases} x + y = {{s}} \\\\ x - y = {{d}} \\end{cases}$"
    answer: "$x = \\frac{{s}} + {{d}}}{2}, \\; y = \\frac{{s}} - {{d}}}{2}$"
    generate_params: |
      from random import randint
      s = randint(4, 12)
      d = randint(1, 5)

  - sub_id: v2   # Elimination method
    question: "Solve for $x$ and $y$: $2x + 3y = {{m}}, \\\\ 4x - y = {{n}}$"
    answer: "Using elimination, $x = \\frac{{m}} + 3{{n}}}{10}, \\; y = \\frac{2{{m}} - {{n}}}{10}$"
    generate_params: |
      from random import randint
      m = randint(6, 20)
      n = randint(3, 15)

  - sub_id: v3   # Substitution method
    question: "Solve the system: $y = 2x + {{c}}, \\\\ 3x + y = {{t}}$"
    answer: "Substitute $y$: $3x + (2x + {{c}}) = {{t}} \\implies 5x = {{t}} - {{c}} \\implies x = \\frac{{t}} - {{c}}}{5}, \\; y = 2x + {{c}}$"
    generate_params: |
      from random import randint
      c = randint(1, 6)
      t = randint(10, 20)
